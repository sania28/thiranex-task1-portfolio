<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 650" role="img" aria-labelledby="title desc">
<title id="title">3D-style girl pointing right</title><desc id="desc">A friendly stylized 3D cartoon developer girl in a lavender hoodie pointing to the right.</desc>
<defs>
 <linearGradient id="hood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e4caff"/><stop offset=".48" stop-color="#a879ef"/><stop offset="1" stop-color="#6542ad"/></linearGradient>
 <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe2d2"/><stop offset=".6" stop-color="#f3b99f"/><stop offset="1" stop-color="#cf806f"/></linearGradient>
 <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#51405f"/><stop offset=".45" stop-color="#211a32"/><stop offset="1" stop-color="#0e0b19"/></linearGradient>
 <linearGradient id="jeans" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9cc8f1"/><stop offset="1" stop-color="#476caa"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="13"/></filter>
 <radialGradient id="cheek"><stop stop-color="#f48e9f" stop-opacity=".65"/><stop offset="1" stop-color="#f48e9f" stop-opacity="0"/></radialGradient>
</defs>
